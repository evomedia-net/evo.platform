# Production stack for zdeploy (composeDir points here).
# SECRETS LIVE OUTSIDE THE PROJECT DIR: zdeploy replaces the project
# directory wholesale on every deploy (preserving only ./.env), so signing
# keys and the DB env live in the sibling ../../evo-platform-secrets/,
# which deploys never touch. The repo's dev keys are excluded from the
# deploy zip and must never reach this box.
name: evo-platform-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Container baseline (evo.hostops#30). The image's entrypoint starts as
    # root only to fix the ownership of a new data directory, then drops to
    # postgres (uid 70). The data is already owned by 70, so start as 70 and
    # hold no capability at all. Proven on this image against existing data
    # and against a new volume. The limits are ceilings, not sizes: this
    # container peaked at 69 MiB and 15 processes.
    user: "70:70"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 400
    mem_limit: 512m
    env_file:
      - ../../evo-platform-secrets/.env.db
    volumes:
      - evoplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Same baseline. The app starts as root, so its capabilities are left as
    # they are until the image runs unprivileged. Peaked at 239 MiB and 38
    # processes.
    security_opt:
      - no-new-privileges:true
    pids_limit: 400
    mem_limit: 768m
    env_file:
      - ../.env
    environment:
      - KEYS_DIR=/app/keys
    volumes:
      - ../../evo-platform-secrets/keys:/app/keys:ro
    ports:
      # box-local only; public exposure comes later via the edge proxy
      - "127.0.0.1:8200:8200"
    networks:
      default: {}
      web:
        # Stable DNS name on the shared proxy network: the edge vhost for
        # platform.evomedia.net proxies to evoplatform_app:8200, and evo-ai
        # resolves its JWKS URL through the same alias — container renames
        # can never break either again.
        aliases:
          - evoplatform_app
    depends_on:
      db:
        condition: service_healthy

networks:
  web:
    external: true

volumes:
  evoplatform_pgdata:
