<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EvoPlatform Admin</title>
  <link rel="stylesheet" href="/admin-ui.css" />
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="card login-card">
      <h1>EvoPlatform</h1>
      <p class="muted">Platform admin console</p>
      <label>Email <input id="login-email" type="email" autocomplete="username" required /></label>
      <!-- A platform admin's row may live inside a tenant rather than at the
           platform level, and login resolves the account within the workspace
           it is given. The hint must not equate "I am a platform admin" with
           "my account is platform-level" - most admin rows live in a
           workspace, and a blank lookup never finds those (#96). -->
      <label>Workspace <span class="muted small">(the workspace you sign in under; blank only if your account has none)</span>
        <input id="login-workspace" type="text" autocomplete="organization" /></label>
      <label>Password</label>
      <!-- Same .pw-field / data-pw-toggle markup the set-password modal uses;
           the reveal handler is delegated from document, so this needs no
           dedicated script. The icon is injected on load so the eye SVG stays
           defined once, in admin-ui.js. -->
      <div class="pw-field">
        <input id="login-password" type="password" autocomplete="current-password" required />
        <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password"></button>
      </div>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary">Sign in</button>
      <!-- The reset flow already exists server-side (POST /auth/forgot); this is
           the only entry point to it. Without it a platform admin who forgets
           their password has no route back in short of editing the database. -->
      <button type="button" id="forgot-link" class="btn">Forgot password?</button>
      <p id="forgot-note" class="muted small" hidden></p>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" hidden>
    <header>
      <a href="#/" class="brand" title="Home">EvoPlatform <span class="muted">Admin</span></a>
      <span class="spacer"></span>
      <span id="who" class="muted"></span>
      <button id="theme-toggle" class="btn ghost" data-tip="Switch between light and dark" data-tip-pos="bottom" aria-label="Toggle theme"></button>
      <button id="logout" class="btn ghost" data-tip="End your admin session" data-tip-pos="bottom">Sign out</button>
    </header>
    <div class="layout">
      <nav id="nav">
        <a href="#/tenants">Tenants</a>
        <a href="#/users">Users</a>
        <a href="#/apps">Apps</a>
        <a href="#/revenue">Revenue</a>
        <a href="#/audit">Audit</a>
        <a href="#/smtp">SMTP</a>
        <a href="#/email">Email copy</a>
      </nav>
      <main id="content"></main>
    </div>
  </div>

  <!-- Sits outside both views so it renders on the login screen and every hash route. -->
  <footer class="site-footer">
    <svg class="evo-mini-mark" width="1em" height="1em" viewBox="0 0 64 64" aria-hidden="true" focusable="false" style="vertical-align:-0.15em;margin-right:0.4em"><mask id="evo-mini-mask"><rect width="64" height="64" rx="13" fill="#fff"/><g fill="none" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M26 20H20v24h6"/><path d="M38 20h6v24h-6"/></g><circle cx="32" cy="32" r="6.5" fill="#000"/></mask><rect width="64" height="64" rx="13" fill="currentColor" mask="url(#evo-mini-mask)"/></svg><span>&copy; <span id="copyright-year">2026</span> Evomedia.net LLC. All rights reserved.</span>
  </footer>

  <!-- Modal -->
  <div id="modal" class="modal-overlay" hidden>
    <div class="card modal-card">
      <div id="modal-body"></div>
      <button id="modal-close" class="btn">Close</button>
    </div>
  </div>

  <div id="toast" hidden></div>
  <script>document.getElementById('copyright-year').textContent = new Date().getFullYear()</script>
  <script src="/admin-ui.js"></script>
</body>
</html>
