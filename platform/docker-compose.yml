# Explicit project name — otherwise compose uses the directory name
# ("platform"), which is meaningless in a Docker Desktop full of stacks.
name: evo-platform

services:
  db:
    image: postgres:17-alpine
    container_name: evoplatform_db
    environment:
      POSTGRES_USER: evoplatform
      POSTGRES_PASSWORD: evoplatform
      POSTGRES_DB: evoplatform
    ports:
      - "5433:5432"
    volumes:
      - evoplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Built-in SMTP for dev: platform sends to :1025, inbox UI at http://localhost:8025
  mail:
    image: axllent/mailpit
    container_name: evoplatform_mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  evoplatform_pgdata:
    # Pinned: this volume predates the project rename (it was created under
    # project "platform"). Without the pin, compose would silently mount a
    # NEW empty volume and the dev tenants/users would "disappear".
    name: evo-platform_evoplatform_pgdata
