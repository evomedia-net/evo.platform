services:
  db:
    image: postgres:17-alpine
    container_name: evoplatform_db
    environment:
      POSTGRES_USER: evoplatform
      POSTGRES_PASSWORD: evoplatform
      POSTGRES_DB: evoplatform
    ports:
      - "5433:5432"
    volumes:
      - evoplatform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evoplatform_pgdata:
