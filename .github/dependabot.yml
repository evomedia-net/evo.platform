# Dependabot, grouped.
#
# Six separate pull requests arrived for one directory on 2026-09-11 and all
# six failed `npm ci`, each for the same reason: a single-package bump
# regenerates the whole lockfile, and a partial regeneration can leave a tree
# whose transitive requirements the new lockfile no longer satisfies. The six
# together resolved cleanly - @auth/prisma-adapter moved to a version that no
# longer needs its own nested nodemailer - but no one of them could, because
# each carried only part of the answer.
#
# Grouping is therefore not tidiness, it is correctness: one pull request per
# ecosystem per directory means one coherent lockfile that either installs or
# does not. `applies-to` appears twice per group because security updates are
# a separate pipeline from version updates and are ungrouped unless told.
#
# Version-update groups carry minor and patch only. The first grouped run
# swept five simultaneous majors into one pull request - NestJS 11 to 12,
# TypeScript 5 to 7, jest 29 to 30, vitest 3 to 5, @types/node 22 to 26 -
# across four directories. It failed on the first of them (@nestjs/throttler
# has no NestJS 12 peer yet) and nobody could have reviewed the rest anyway:
# each of those is a migration with its own breakages, and bundled together
# there is no way to take one and leave another. Majors still arrive, one
# pull request each, which is the right size to judge them at.
#
# Security groups deliberately keep every update type. A fix that only exists
# in a major is still the fix, and that is exactly the case to see rather
# than filter out.
#
# Weekly rather than daily: these are libraries, not incidents. Security
# updates ignore the schedule and arrive when the advisory does.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /platform
      - /templates/next
      - /packages/sdk-node
      - /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript majors are held until ts-jest can accept one.
    #
    # ts-jest 29.4.12 - the latest stable - declares `typescript ">=4.3 <7"`,
    # so a bump to 7.x fails at resolution before a single test runs:
    #
    #     npm error Could not resolve dependency:
    #     npm error peer typescript@">=4.3 <7" from ts-jest@29.4.12
    #
    # Three directories use ts-jest (platform, cli, packages/sdk-node) and all
    # three were permanently blocked pull requests. templates/next runs vitest
    # and is unaffected. There is no ts-jest release that takes TypeScript 7,
    # not even on `next` - that tag is 29.0.0-next.1, an older prerelease.
    #
    # REMOVE THIS as soon as ts-jest ships a TypeScript 7 peer range; check
    # with `npm view ts-jest peerDependencies.typescript`. Note that 6.x IS
    # inside the current range, so moving to TypeScript 6 first is a real
    # option and would need this entry narrowed rather than deleted.
    #
    # Only version updates are ignored. A security advisory in TypeScript
    # would still arrive, which is the point of leaving the security group
    # untouched above.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /packages/sdk-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      pip-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # The workflow pins every action to a commit SHA, which is the right call and
  # also means nothing tells us when one moves. Dependabot reads the `# v4`
  # comment beside each pin and updates both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
