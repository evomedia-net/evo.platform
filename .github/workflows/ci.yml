name: CI

# Fork pull requests run this workflow once the repository is public. The
# token they receive can read the code and nothing else; no job here needs
# to write anything (#173).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: platform
            prisma: true
          - dir: packages/sdk-node
            prisma: false
          - dir: cli
            prisma: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      # Generate the Prisma client so the TypeScript build type-checks. No DB
      # connection is made; the URL is a placeholder to satisfy the datasource.
      - name: Prisma generate
        if: ${{ matrix.prisma }}
        working-directory: ${{ matrix.dir }}
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: npm test

  # packages/sdk-python is a published package (evoplatform-sdk), but the
  # matrix above is Node all the way down - setup-node, npm ci, npm test - so
  # it gets its own job rather than a fourth entry that shares none of those
  # steps. Until this existed, its 40 tests had never run in CI (#148).
  build-test-python:
    name: build + test (packages/sdk-python, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject advertises 3.10 through 3.14. Testing both ends keeps that
        # claim honest; the versions between them share the same pure-Python
        # code path, so five near-identical jobs would buy little.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: packages/sdk-python
        run: pytest

      # The Node jobs type-check via `npm run build`; the equivalent risk here
      # is a packaging error, which otherwise only surfaces at publish time.
      - name: Build (sdist + wheel)
        working-directory: packages/sdk-python
        run: |
          pip install build
          python -m build

  # templates/next ships to every scaffolded app, so a break here travels
  # further than one repo - and one already did: recovery.test.ts asserted a
  # shape #131 had removed and sat red on main, because nothing ran it (#139).
  build-test-template:
    name: build + test (templates/next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/sdk-node/package-lock.json
            templates/next/package-lock.json

      # The template links the SDK as a file: dependency, so its dist must
      # exist before the template installs. The build deliberately does NOT
      # happen during that install: it used to, via the SDK's `prepare`, and a
      # TypeScript build inside a consumer's install depends on devDependencies
      # (@types/node, for the fetch and AbortSignal globals) that a consumer
      # install never provides. `prepare` is now `prepack`, so packing and
      # publishing still build - and this job builds explicitly instead.
      - name: Build the SDK the template links to
        working-directory: packages/sdk-node
        run: |
          npm ci
          npm run build

      # postinstall runs `prisma generate`; no DATABASE_URL is needed, since
      # the template's datasource URL lives in prisma.config.ts, not the schema.
      - name: Install
        working-directory: templates/next
        run: npm ci

      - name: Build
        working-directory: templates/next
        run: npm run build

      - name: Test
        working-directory: templates/next
        run: npm test

  # Every .md has a generated .txt twin (scripts/md_txt.py). A .md edit that
  # forgets to regenerate would ship a stale mirror; this fails it instead.
  # Its own job so the failure is named for what it is, and because there is
  # no root test harness to hang it off.
  twins:
    name: .txt twins in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/md_txt.py --check

  # The one test that talks to a real platform - sdk-node's integration
  # script - had no schedule: every suite mocks fetch, and nothing else ran
  # it. This job boots the platform against a throwaway Postgres, seeds the
  # demo tenant and app, and runs the script against it (#201). The seed
  # prints app_demo's client secret exactly once; that line is the credential.
  integration:
    name: integration (sdk-node against a live platform)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Outside production the platform boots on DATABASE_URL alone: the dev
      # SECRET_KEY fallback is allowed, signing keys are generated on first
      # boot, and with no SMTP configured sendEmail answers 503 - which is
      # what the script expects.
      SEED_OWNER_PASSWORD: integration-test-passphrase-ok
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            platform/package-lock.json
            packages/sdk-node/package-lock.json

      - name: Install, migrate and seed the platform
        id: seed
        working-directory: platform
        run: |
          npm ci
          npx prisma migrate deploy
          npm run seed | tee seed.log
          secret=$(grep -oE 'clientSecret=[A-Za-z0-9_-]+' seed.log | cut -d= -f2)
          test -n "$secret" || { echo "seed did not print app_demo's client secret"; exit 1; }
          echo "::add-mask::$secret"
          echo "client_secret=$secret" >> "$GITHUB_OUTPUT"

      - name: Build and start the platform
        working-directory: platform
        run: |
          npm run build
          KEYS_DIR=./keys-ci nohup node dist/main.js > platform.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8200/.well-known/jwks.json > /dev/null && exit 0
            sleep 1
          done
          echo "platform did not come up within 30s"; cat platform.log; exit 1

      - name: Run the SDK integration script
        working-directory: packages/sdk-node
        env:
          PLATFORM_URL: http://localhost:8200
          EVO_CLIENT_SECRET: ${{ steps.seed.outputs.client_secret }}
          EVO_TEST_PASSWORD: ${{ env.SEED_OWNER_PASSWORD }}
        run: |
          npm ci
          npx tsx scripts/integration.ts

      - name: Platform log
        if: failure()
        working-directory: platform
        run: cat platform.log || true

  # The fleet's auth-screen rules - password eye toggles, preserved fields on
  # a failed sign-in, the sessionStorage handoff between screens, a header
  # that never scrolls away - are behaviours of a page in a browser. A unit
  # test can show a toggle renders; only a browser can show it works. This
  # runs templates/next in standalone mode against a throwaway Postgres and
  # drives the screens with Playwright (#200).
  e2e:
    name: e2e (templates/next auth screens)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: e2e-only-not-a-real-secret-0123456789abcdef
      AUTH_URL: http://localhost:4180
      # No PLATFORM_URL: standalone mode, local credentials, the seeded user.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/sdk-node/package-lock.json
            templates/next/package-lock.json

      # The template links the SDK as a file: dependency; its dist must exist
      # before the template installs (see build-test-template).
      - name: Build the SDK the template links to
        working-directory: packages/sdk-node
        run: |
          npm ci
          npm run build

      - name: Install, migrate, seed and build the template
        working-directory: templates/next
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed
          npm run build

      - name: Install the browser
        working-directory: templates/next
        run: npx playwright install --with-deps chromium

      - name: Start the app
        working-directory: templates/next
        run: |
          nohup npm run start > app.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://localhost:4180/login > /dev/null && exit 0
            sleep 1
          done
          echo "app did not come up within 40s"; cat app.log; exit 1

      - name: Run the auth-screen tests
        working-directory: templates/next
        run: npm run test:e2e

      - name: App log
        if: failure()
        working-directory: templates/next
        run: cat app.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: templates/next/playwright-report
          retention-days: 7
