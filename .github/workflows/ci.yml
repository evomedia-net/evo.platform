name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: build + test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: platform
            prisma: true
          - dir: packages/sdk-node
            prisma: false
          - dir: cli
            prisma: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.dir }}
        run: npm ci

      # Generate the Prisma client so the TypeScript build type-checks. No DB
      # connection is made; the URL is a placeholder to satisfy the datasource.
      - name: Prisma generate
        if: ${{ matrix.prisma }}
        working-directory: ${{ matrix.dir }}
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: npm test

  # packages/sdk-python is a published package (evoplatform-sdk), but the
  # matrix above is Node all the way down - setup-node, npm ci, npm test - so
  # it gets its own job rather than a fourth entry that shares none of those
  # steps. Until this existed, its 40 tests had never run in CI (#148).
  build-test-python:
    name: build + test (packages/sdk-python, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject advertises 3.10 through 3.14. Testing both ends keeps that
        # claim honest; the versions between them share the same pure-Python
        # code path, so five near-identical jobs would buy little.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/sdk-python/pyproject.toml

      - name: Install
        working-directory: packages/sdk-python
        run: pip install -e ".[dev]"

      - name: Test
        working-directory: packages/sdk-python
        run: pytest

      # The Node jobs type-check via `npm run build`; the equivalent risk here
      # is a packaging error, which otherwise only surfaces at publish time.
      - name: Build (sdist + wheel)
        working-directory: packages/sdk-python
        run: |
          pip install build
          python -m build

  # templates/next ships to every scaffolded app, so a break here travels
  # further than one repo - and one already did: recovery.test.ts asserted a
  # shape #131 had removed and sat red on main, because nothing ran it (#139).
  build-test-template:
    name: build + test (templates/next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/sdk-node/package-lock.json
            templates/next/package-lock.json

      # The template links the SDK as a file: dependency, so its dist must
      # exist before the template installs. The build deliberately does NOT
      # happen during that install: it used to, via the SDK's `prepare`, and a
      # TypeScript build inside a consumer's install depends on devDependencies
      # (@types/node, for the fetch and AbortSignal globals) that a consumer
      # install never provides. `prepare` is now `prepack`, so packing and
      # publishing still build - and this job builds explicitly instead.
      - name: Build the SDK the template links to
        working-directory: packages/sdk-node
        run: |
          npm ci
          npm run build

      # postinstall runs `prisma generate`; no DATABASE_URL is needed, since
      # the template's datasource URL lives in prisma.config.ts, not the schema.
      - name: Install
        working-directory: templates/next
        run: npm ci

      - name: Build
        working-directory: templates/next
        run: npm run build

      - name: Test
        working-directory: templates/next
        run: npm test
