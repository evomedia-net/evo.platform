# Cut a release: bump the stamp, open the release pull request, tag on merge.
#
# Run `prepare` from the Actions tab and pick a segment. The decision stays
# human on purpose - a build number names something that SHIPPED, and whether
# a set of merges constitutes a release is a judgement no trigger can make. On
# every push to main it would mean one build per merge, which is precisely the
# inflation the fleet rule forbids. What this removes is the five mechanical
# steps around that judgement, not the judgement.
#
# The awkward bit, and why the branch trigger in ci.yml matters:
# a pull request opened with GITHUB_TOKEN does NOT trigger workflow runs -
# GitHub blocks that to stop recursion - so the required checks would never
# report and the release would sit unmergeable forever. Pushing the branch
# does trigger CI, and check runs attach to the commit SHA rather than to the
# event, so the same runs satisfy the pull request. ci.yml therefore watches
# `chore/release-*` on push. Nothing bypasses the ruleset; the release goes
# through a pull request like every other change.
name: release

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "Which segment to bump. A stage bump zeroes everything below it."
        required: true
        default: build
        type: choice
        options: [build, alpha, beta, rc, release]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Two releases at once would race on the stamp and could tag the wrong commit.
# Queue rather than cancel - a half-finished release is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare the release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit, not a moving tag: a tag can be repointed
      # by whoever owns it, and this job has a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so an existing one is detectable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse to release nothing
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last" ]; then
            n=$(git rev-list --count "$last"..HEAD)
            echo "commits since $last: $n"
            if [ "$n" -eq 0 ]; then
              echo "::error::Nothing has shipped since $last. A build number names something that shipped; bumping now would count a release against no change."
              exit 1
            fi
            git log --oneline "$last"..HEAD
          fi

      - name: Compute and write the new version
        id: bump
        run: |
          current=$(python scripts/bump_version.py --show)
          next=$(python scripts/bump_version.py "${{ inputs.segment }}" --write)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next"       >> "$GITHUB_OUTPUT"
          echo "$current -> $next (${{ inputs.segment }})"

      - name: Refuse a tag that already exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.next }}" >/dev/null; then
            echo "::error::Tag ${{ steps.bump.outputs.next }} already exists."
            exit 1
          fi

      # The stamp is the only thing that may change. Anything else means the
      # arithmetic or the checkout is wrong, and a release is the worst place
      # to find that out afterwards.
      - name: Refuse to commit anything but the stamp
        run: |
          changed=$(git diff --name-only)
          echo "changed: $changed"
          if [ "$changed" != "platform/build-version.json" ]; then
            echo "::error::Expected only platform/build-version.json to change, got: $changed"
            exit 1
          fi

      - name: Push the release branch
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          CURRENT: ${{ steps.bump.outputs.current }}
          SEGMENT: ${{ inputs.segment }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "chore/release-$NEXT"
          git add platform/build-version.json
          git commit -m "chore(release): $NEXT" \
                     -m "Bumped the $SEGMENT segment: $CURRENT -> $NEXT. Cut from the release workflow by ${{ github.actor }}."
          git push origin "chore/release-$NEXT"

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.bump.outputs.next }}
          CURRENT: ${{ steps.bump.outputs.current }}
          SEGMENT: ${{ inputs.segment }}
        run: |
          last=$(git describe --tags --abbrev=0 "origin/main" 2>/dev/null || echo "")
          {
            echo "Bumps the \`$SEGMENT\` segment: \`$CURRENT\` → \`$NEXT\`."
            echo
            if [ -n "$last" ]; then
              echo "### Ships since $last"
              echo
              git log --format='- %s' "$last"..origin/main
              echo
            fi
            echo "Cut from the release workflow by @${{ github.actor }}."
            echo "The annotated tag \`$NEXT\` is laid automatically when this merges."
            echo
            echo "Deploying is a separate, deliberate step."
          } > body.md
          gh pr create --base main --head "chore/release-$NEXT" \
            --title "chore(release): $NEXT" --body-file body.md
          {
            echo "## $NEXT prepared"
            echo
            echo "\`$CURRENT\` → \`$NEXT\` (\`$SEGMENT\`). Merge the pull request to tag it."
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: tag the release
    # Only for the stamp commit itself, so ordinary merges are ignored.
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the merge commit
        run: |
          version=$(python -c "import json;print(json.load(open('platform/build-version.json'))['version'])")
          echo "stamp says: $version"

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists — nothing to do."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          echo "Tagged $version at $(git rev-parse --short HEAD)"
          {
            echo "## Tagged $version"
            echo
            echo "Annotated tag laid at \`$(git rev-parse --short HEAD)\` and pushed."
            echo
            echo "Deploying is a separate, deliberate step."
          } >> "$GITHUB_STEP_SUMMARY"
