# Cut a release: bump the stamp, commit it to main, lay the annotated tag.
#
# Run it from the Actions tab (Run workflow) and pick a segment. The decision
# stays human on purpose - a build number names something that SHIPPED, and
# whether a set of merges constitutes a release is a judgement no trigger can
# make. A workflow on every push to main would give one build per merge, which
# is precisely the inflation the fleet rule forbids. What this removes is the
# five mechanical steps around that judgement, not the judgement.
#
# Why it commits straight to main rather than opening a pull request:
# a pull request opened with GITHUB_TOKEN does not trigger workflow runs -
# GitHub blocks that to stop recursion - so the nine required checks would
# never report and the release could never merge. It would sit there forever.
# The alternatives are a personal access token kept as a secret, or this: the
# GitHub Actions app is a bypass actor on the main ruleset, and pushes a
# one-value generated commit. CI still runs on that push, and the commit it
# tags has a parent that already passed.
name: release

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "Which segment to bump. A stage bump zeroes everything below it."
        required: true
        default: build
        type: choice
        options: [build, alpha, beta, rc, release]

# contents: write is what pushes the commit and the tag. Nothing else is needed.
permissions:
  contents: write

# Two releases at once would race on the stamp and could lay a tag on the
# wrong commit. Queue them instead of cancelling - a half-finished release is
# worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: cut a release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit, not a moving tag: a tag can be repointed
      # by whoever owns it, and this job has a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so an existing one is detectable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse to release nothing
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last" ]; then
            n=$(git rev-list --count "$last"..HEAD)
            echo "commits since $last: $n"
            if [ "$n" -eq 0 ]; then
              echo "::error::Nothing has shipped since $last. A build number names something that shipped; bumping now would count a release against no change."
              exit 1
            fi
            git log --oneline "$last"..HEAD
          fi

      - name: Compute and write the new version
        id: bump
        run: |
          current=$(python scripts/bump_version.py --show)
          next=$(python scripts/bump_version.py "${{ inputs.segment }}" --write)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next"       >> "$GITHUB_OUTPUT"
          echo "$current -> $next (${{ inputs.segment }})"

      - name: Refuse a tag that already exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.next }}" >/dev/null; then
            echo "::error::Tag ${{ steps.bump.outputs.next }} already exists."
            exit 1
          fi

      # The stamp is the only thing that may change. Anything else means the
      # arithmetic or the checkout is wrong, and a release is the worst place
      # to find that out afterwards.
      - name: Refuse to commit anything but the stamp
        run: |
          changed=$(git diff --name-only)
          echo "changed: $changed"
          if [ "$changed" != "platform/build-version.json" ]; then
            echo "::error::Expected only platform/build-version.json to change, got: $changed"
            exit 1
          fi

      - name: Commit, tag and push
        env:
          NEXT: ${{ steps.bump.outputs.next }}
          CURRENT: ${{ steps.bump.outputs.current }}
          SEGMENT: ${{ inputs.segment }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/build-version.json
          git commit -m "chore(release): $NEXT" \
                     -m "Bumped the $SEGMENT segment: $CURRENT -> $NEXT. Cut from the release workflow by ${{ github.actor }}."
          git tag -a "$NEXT" -m "$NEXT"
          git push origin HEAD:main --follow-tags
          {
            echo "## $NEXT"
            echo
            echo "Bumped \`$SEGMENT\`: \`$CURRENT\` → \`$NEXT\`, tagged and pushed to main."
            echo
            echo "Deploying is a separate, deliberate step."
          } >> "$GITHUB_STEP_SUMMARY"
