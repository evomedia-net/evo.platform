<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="fig" width="920" height="560" viewBox="0 0 920 560" role="img"
         aria-label="Sign-up sequence: the person submits the form to the app, the app calls the platform once, the platform creates tenant, admin user and trial access, emails a verification link, and login is refused until the link is clicked.">
<style>
  /* Self-contained: light by default, dark via media query (GitHub + docs site). */
  svg { font: 12px ui-monospace, "Cascadia Code", Consolas, monospace; }
  .bg { fill: #FFFFFF; }
  text { fill: #16283C; }
  .actor rect { fill: #EAF1F8; stroke: #003366; stroke-width: 1.2; }
  .actor text { font-weight: 600; fill: #003366; text-anchor: middle; }
  .life { stroke: #B7C7D8; stroke-width: 1; stroke-dasharray: 2 5; }
  .req  { stroke: #16283C; stroke-width: 1.5; fill: none; }
  .resp { stroke: #5A6B7E; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
  .push { stroke: #C77D28; stroke-width: 1.7; fill: none; }
  .hi   { stroke: #2E6DA8; stroke-width: 1.8; fill: none; }
  .lbl { text-anchor: middle; } .lbl.dim { fill: #5A6B7E; }
  .lbl.hue { fill: #C77D28; } .lbl.blue { fill: #2E6DA8; }
  .selfbox rect { fill: #EAF1F8; stroke: #C9D6E4; }
  .selfbox text { text-anchor: middle; fill: #16283C; }
  .selfbox.hib rect { stroke: #2E6DA8; stroke-width: 1.4; }
  .num circle { fill: #003366; }
  .num text { fill: #F6F9FC; font-weight: 700; font-size: 10.5px; text-anchor: middle; }
  .ah { fill: #16283C; } .ah-r { fill: #5A6B7E; }
  .ah-p { fill: #C77D28; } .ah-h { fill: #2E6DA8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #14293F; }
    text { fill: #E8F0F8; }
    .actor rect { fill: #1B3450; stroke: #A9C8E8; }
    .actor text { fill: #A9C8E8; }
    .life { stroke: #3A5878; }
    .req { stroke: #E8F0F8; } .resp { stroke: #93A7BC; }
    .push { stroke: #E5A455; } .hi { stroke: #6FA8DC; }
    .lbl.dim { fill: #93A7BC; } .lbl.hue { fill: #E5A455; } .lbl.blue { fill: #6FA8DC; }
    .selfbox rect { fill: #1B3450; stroke: #2C4966; }
    .selfbox text { fill: #E8F0F8; }
    .selfbox.hib rect { stroke: #6FA8DC; }
    .num circle { fill: #A9C8E8; }
    .num text { fill: #0E1F33; }
    .ah { fill: #E8F0F8; } .ah-r { fill: #93A7BC; }
    .ah-p { fill: #E5A455; } .ah-h { fill: #6FA8DC; }
  }
</style>
<rect class="bg" x="0" y="0" width="920" height="560"/>
      <defs>
        <marker id="a1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah" d="M0 0 L10 4 L0 8 z"/></marker>
        <marker id="a1r" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah-r" d="M0 0 L10 4 L0 8 z"/></marker>
        <marker id="a1p" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto"><path class="ah-p" d="M0 0 L10 4 L0 8 z"/></marker>
      </defs>

      <!-- actors -->
      <g class="actor"><rect x="35" y="16" width="110" height="32" rx="7"/><text x="90" y="37">Person</text></g>
      <g class="actor"><rect x="255" y="16" width="130" height="32" rx="7"/><text x="320" y="37">App (SWAG…)</text></g>
      <g class="actor"><rect x="540" y="16" width="120" height="32" rx="7"/><text x="600" y="37">Platform</text></g>
      <g class="actor"><rect x="790" y="16" width="100" height="32" rx="7"/><text x="840" y="37">Mailbox</text></g>

      <!-- lifelines -->
      <line class="life" x1="90"  y1="48" x2="90"  y2="540"/>
      <line class="life" x1="320" y1="48" x2="320" y2="540"/>
      <line class="life" x1="600" y1="48" x2="600" y2="540"/>
      <line class="life" x1="840" y1="48" x2="840" y2="540"/>

      <!-- 1 person -> app -->
      <g class="num"><circle cx="104" cy="86" r="10"/><text x="104" y="89.5">1</text></g>
      <text class="lbl" x="205" y="75">submits the /signup form</text>
      <line class="req" x1="94" y1="86" x2="312" y2="86" marker-end="url(#a1)"/>

      <!-- 2 app -> platform -->
      <g class="num"><circle cx="334" cy="134" r="10"/><text x="334" y="137.5">2</text></g>
      <text class="lbl" x="460" y="123">POST /auth/signup {…, clientId}</text>
      <line class="req" x1="324" y1="134" x2="592" y2="134" marker-end="url(#a1)"/>

      <!-- 3 platform self -->
      <g class="num"><circle cx="443" cy="196" r="10"/><text x="443" y="199.5">3</text></g>
      <g class="selfbox">
        <rect x="458" y="172" width="286" height="48" rx="6"/>
        <text x="601" y="192">Tenant + founder admin (unverified)</text>
        <text x="601" y="208">+ TRIAL access — for THIS app only</text>
      </g>

      <!-- 4 platform -> mailbox (push) -->
      <g class="num"><circle cx="614" cy="258" r="10"/><text x="614" y="261.5">4</text></g>
      <text class="lbl hue" x="720" y="247">verification email · single-use link</text>
      <line class="push" x1="604" y1="258" x2="832" y2="258" marker-end="url(#a1p)"/>

      <!-- 5 responses back -->
      <g class="num"><circle cx="585" cy="306" r="10"/><text x="585" y="309.5">5</text></g>
      <text class="lbl dim" x="460" y="295">201 created</text>
      <line class="resp" x1="596" y1="306" x2="328" y2="306" marker-end="url(#a1r)"/>
      <text class="lbl dim" x="205" y="337">“check your email” — login refused until verified</text>
      <line class="resp" x1="316" y1="348" x2="98" y2="348" marker-end="url(#a1r)"/>

      <!-- 6 person -> platform via link -->
      <g class="num"><circle cx="104" cy="404" r="10"/><text x="104" y="407.5">6</text></g>
      <text class="lbl" x="345" y="393">clicks emailed link → GET /auth/verify?token=…</text>
      <line class="req" x1="94" y1="404" x2="592" y2="404" marker-end="url(#a1)"/>

      <!-- 7 platform self -->
      <g class="num"><circle cx="443" cy="462" r="10"/><text x="443" y="465.5">7</text></g>
      <g class="selfbox">
        <rect x="458" y="440" width="286" height="44" rx="6"/>
        <text x="601" y="458">emailVerifiedAt stamped —</text>
        <text x="601" y="474">sign-in now allowed (see Flow 2)</text>
      </g>

      <!-- 8 response person -->
      <text class="lbl dim" x="345" y="509">“email verified — sign in”</text>
      <line class="resp" x1="592" y1="520" x2="98" y2="520" marker-end="url(#a1r)"/>
    </svg>
