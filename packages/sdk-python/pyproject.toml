[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evoplatform-sdk"
# Versioned in step with @evoplatform/sdk-node: the two SDKs mirror one
# surface, and a shared number states which surface this is.
version = "0.4.2"
description = "Python SDK for EvoPlatform: local JWT verification via cached JWKS, auth proxy, billing, brand, email, and the Ask AI client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kelly Michels", email = "dev@evomedia.net" }]
keywords = ["evoplatform", "multi-tenant", "saas", "auth", "jwt", "jwks", "tenancy", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
]

[project.urls]
Homepage = "https://github.com/evomedia-net/evo.platform/tree/main/packages/sdk-python"
Repository = "https://github.com/evomedia-net/evo.platform"
Issues = "https://github.com/evomedia-net/evo.platform/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["evoplatform_sdk*"]

[tool.setuptools.package-data]
evoplatform_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
