[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evoplatform-sdk"
# Versioned in step with @evoplatform/sdk-node: the two SDKs mirror one
# surface, and a shared number states which surface this is.
version = "0.3.0"
description = "Python SDK for EvoPlatform: local JWT verification via cached JWKS, auth proxy, billing, email, and the Ask AI client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["evoplatform_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
